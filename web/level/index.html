<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="/" />
<title>Super Gere — Livello 1</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a12; color: #eee; font-family: 'Courier New', monospace; }
  body { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 12px; }
  #levelCanvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 2px solid #2a2a3a;
    width: min(96vw, 1100px);
  }
  .hint { font-size: 12px; color: #8a8aa8; margin: 0; }
  .hint strong { color: #ffd54d; }
</style>
</head>
<body>
<p class="hint">
  WASD/Arrows walk · <strong>Shift</strong> run · Space jump ·
  J punch · K roll · L heavy · <strong>ESC</strong> back
</p>
<!-- Height matches lv1-background.png's aspect at 960 wide, so the strip
     draws at 1:1 rather than being scaled down. -->
<canvas id="levelCanvas" width="960" height="387"></canvas>

<script src="js/i18n.js"></script>
<script src="js/sprites.js"></script>
<script src="js/assets.js"></script>
