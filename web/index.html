<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Super Gere: Parise Rescue</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a12;
    color: #eee;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100%;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 8px;
  }
  #gameCanvas {
    background: #000;
    image-rendering: pixelated;
    border: 4px solid #2a2a3a;
    box-shadow: 0 0 40px rgba(255, 200, 60, 0.15);
    /* Actively scale the canvas to fill available space (not just cap it)
       while preserving its 480x270 (16:9) aspect ratio via width+height
       set together, since max-width/max-height alone don't grow a canvas
       past its intrinsic pixel size. */
    width: min(96vw, 82vh * (480 / 270));
    height: min(82vh, 96vw * (270 / 480));
  }
  #hint {
    font-size: 12px;
    color: #888;
    text-align: center;
    max-width: 640px;
  }
  #hint b { color: #ffd15c; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gameCanvas" width="480" height="270"></canvas>
  <div id="hint">
    Move: <b>Arrow Keys / WASD</b> &nbsp; Punch Combo: <b>J</b> &nbsp; Knee Slide: <b>K</b> &nbsp;
    Jump: <b>Space</b> &nbsp; Pause: <b>P</b>
  </div>
</div>

<script src="js/sprites.js"></script>
<script src="js/assets.js"></script>
<script src="js/entities.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
</body>
</html>
