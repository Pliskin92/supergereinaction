<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Super Gere: Parise Rescue</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #0d0c1d;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* The menu draws its own full-canvas backdrop, so the page is just a
     frame around it — no badge, no headline, no card. */
  #titleCanvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: min(96vw, 170vh);
    height: min(94vh, 54vw);
  }
</style>
</head>
<body>

<canvas id="titleCanvas" width="480" height="270"></canvas>

<script src="js/i18n.js"></script>
<script src="js/highscores.js"></script>
<script src="js/title.js"></script>
<script src="js/game.js"></script>

</body>
</html>
