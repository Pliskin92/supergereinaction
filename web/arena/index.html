<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="/" />
<title>Super Gere — Arena</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a12; color: #eee; font-family: 'Courier New', monospace; }
  body { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 12px; }
  #arenaCanvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 2px solid #2a2a3a;
    width: min(92vw, 900px);
  }
  .hint {
    font-size: 12px;
    color: #8a8aa8;
    margin: 0;
  }
  .hint strong { color: #ffd54d; }
  .pickers { display: flex; gap: 8px; }
  #characterSelect, #stageSelect {
    font-family: inherit;
    font-size: 14px;
    background: #181828;
    color: #eee;
    border: 1px solid #3a3a52;
    padding: 6px 10px;
  }
</style>
</head>
<body>
<div class="pickers">
  <select id="characterSelect">
    <option value="gere">Gere</option>
    <option value="giox">Giox</option>
    <option value="minion">Minion</option>
    <option value="boss1">Boss 1</option>
  </select>
  <!-- Options are filled in from the Stages table in js/stages.js. -->
  <select id="stageSelect"></select>
</div>
<p class="hint">
  WASD/Arrows move · J punch · K roll · L heavy · Space jump ·
  <strong>R</strong> reset sack · <strong>F</strong> force FURY
</p>
<canvas id="arenaCanvas" width="960" height="480"></canvas>

<script src="js/i18n.js"></script>
<script src="js/sprites.js"></script>
<script src="js/assets.js"></script>
<script src="js/entities.js"></script>
<script src="js/stages.js"></script>
<script src="js/fury-hud.js"></script>
<script src="js/char-arena.js"></script>
</body>
</html>
