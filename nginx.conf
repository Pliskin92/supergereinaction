# Serving rules for the game.
#
# The default nginx config sends `cache-control: private` with no max-age on
# everything, which means the browser revalidates every file on every visit:
# 102 spritesheets, 250 requests, each a round trip even when nothing has
# changed. That is why the deployed game was slow on a second visit as well
# as a first.
#
# The split below is the important part:
#
#   * ART is immutable in practice -- a spritesheet's pixels do not change
#     without the file being replaced -- so it is cached hard, for a year.
#     A changed sheet ships under a new image tag anyway, and the HTML that
#     names it is never cached (see below), so a stale sheet cannot outlive
#     a deploy that replaces it.
#
#   * HTML is never cached. The pages carry ?v= query strings on their
#     script tags, and a cached page would keep pointing at old script URLs
#     forever -- the pages already say this in their own <meta> tags, and
#     this enforces it at the server.
#
#   * JS/CSS are cached briefly and revalidated. They change far more often
#     than art, and the ?v= strings are bumped by hand rather than by a
#     content hash, so a long cache here would be a foot-gun.

server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip the text. It does nothing for PNG (already compressed) but the
    # scripts are ~90KB of source that compresses to a fraction of that.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml
                      application/manifest+json;

    # Sprite sheets, atlases, backgrounds, icons. The bulk of the payload,
    # and the part that must not be re-fetched on every visit.
    location /assets/ {
        # `expires` would emit a second, weaker Cache-Control of its own, so
        # the header is set once explicitly instead of both ways.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Scripts and styles: revalidate, but allow a cached copy to be reused
    # once the server confirms it is current. `no-cache` means "check first",
    # not "do not store" -- the 304 that usually follows is a few hundred
    # bytes instead of the whole file.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The manifest names the icons and start_url; treat it like the pages.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # The pages themselves: never cached, so a deploy is picked up at once.
    location / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri $uri/ =404;
    }
}
