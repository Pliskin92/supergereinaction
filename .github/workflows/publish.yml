# Publishes the container image to ghcr.io on every push to main, so the
# game can be self-hosted with a single `docker run`.
#
# No secret to configure: ghcr.io authenticates with the GITHUB_TOKEN that
# every workflow run already has.
#
# There is deliberately no GitHub Pages job. Pages on a PRIVATE repo needs a
# paid plan, and this repo is private; the image is the supported way to run
# the game. Any static host (Cloudflare Pages, Netlify) can serve web/ as-is
# if a click-to-play URL is wanted later -- note that the pages are written
# for a domain ROOT (<base href="/"> plus absolute links), so a host that
# serves from a subpath needs those rewritten.

name: Publish image

on:
  push:
    branches: [main]
  # Lets a release be re-cut without an empty commit.
  workflow_dispatch:

# Two pushes in quick succession would otherwise race to tag `latest`.
# Queued rather than cancelled, so the newest commit is the one that ends up
# on `latest` and an in-flight push is not left half-uploaded.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Publish image to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Every workflow run has this already; no secret to configure.
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image name must be lowercase, and the owner here is not
      # (Pliskin92), so it cannot simply be interpolated.
      - name: Work out the image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Tag the image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          # `latest` for the newest main, plus the commit sha so a specific
          # build can always be pulled back.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Phones and Apple Silicon are arm64; CI runners and most servers
          # are amd64. Both are built so `docker run` works either way.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
