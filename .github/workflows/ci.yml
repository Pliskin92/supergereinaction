name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sprite-trim:
    name: Sprite trim data is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      # trim.json is committed, but it is derived from the spritesheet
      # pixels and the Dockerfile copies web/ verbatim without regenerating
      # it. An edited spritesheet committed without rerunning the script
      # therefore ships stale trim data silently -- clips render at the
      # wrong size or with feet off the floor. Regenerating here and
      # diffing catches that: no diff means the commit is consistent.
      - name: Regenerate sprite trim data
        run: python3 scripts/build-sprite-trim.py

      - name: Fail if trim data was out of date
        run: |
          if ! git diff --quiet -- '**/trim.json'; then
            echo "::error::trim.json is stale. Run 'python3 scripts/build-sprite-trim.py' and commit the result."
            git diff --stat -- '**/trim.json'
            git diff -- '**/trim.json'
            exit 1
          fi
          echo "Sprite trim data is up to date."

  docker-image-scan:
    name: Docker image vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t super-gere:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: super-gere:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
